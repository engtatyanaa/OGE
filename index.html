const T12=[
{n:"Vladivostok",id:"303746",k:"C-DAFBE",
q:["Why was Vladivostok called so?","Who founded the city of Vladivostok?","Why has the city quickly become important?","What is the climate of the city area?","How is it possible to travel to the city?","What are the city sights one should visit?","What makes Vladivostok buildings unique?"],
t:["Vladivostok is located at the same latitude as Russian subtropical sea resort Sochi, but its average annual temperature is nearly 10 degrees lower because of the Siberian Anticyclone. It brings cold winds from Yakutia for much of the winter season. Thus, the winter in Vladivostok is typical of Manchuria – it is cold, clear, and very windy. The snow is rare and, in some years, may not fall at all. The summer is more comfortable, warm, wet, and partly cloudy.",
"The first thing that will catch the eye of every tourist right from the platform of the railway station is a unique building of the terminal of the Trans-Siberian Railway. It was built more than a century ago. The sea terminal, located nearby, is also a must-see while going on a tour of Vladivostok. Like other port cities, Vladivostok celebrates the Russian fleet with a number of museums. No doubt, the legendary S-56 submarine which played a great role in the Great Patriotic War is worth visiting.",
"The most important city in the Russian Far East, Vladivostok is known as the town of sailors. It was founded about 160 years ago as a small military port. Despite being one of the youngest Russian cities, Vladivostok managed to find its way to the list of the best Russian cities to visit. Its name came from the combination of two words, vladet (meaning “to own”) and vostok (meaning “east”), helping anyone who wants to find Vladivostok on a map.",
"The Trans-Siberian Railway was built to connect Asian and European Russia. The final stop on the way, or the first if passengers are travelling west, is in Vladivostok. The city’s strategic location and port led to the fact that Vladivostok has eventually become a large and busy centre in North-East Asia. After its foundation in 1860 as a military post, Vladivostok soon became the centre of international commerce and development.",
"Despite the fact that Vladivostok has always been a Russian city, elements of the Chinese and Japanese architecture borrowed from the city’s nearest neighbours can be seen even during a simple walk down the city streets. At the same time, the architecture of Vladivostok leaves no doubt that this is a Russian city. So, this unique place combines a lot of different features.",
"As a rule, people prefer to spend a couple of days exploring Vladivostok within their long tour to the Far East, instead of considering the city as an independent holiday destination. They may fly to Vladivostok or go by rail choosing the famous Trans-Siberian express which is very popular with tourists. The Trans-Siberian Railway is the longest railway route in the world. So, going by train to Vladivostok can easily become a journey of a lifetime."]},
{n:"Veliky Novgorod",id:"D61DF5",k:"BC-ADFE",
q:["What made Veliky Novgorod one of the main cities of the past?","What is known about the ancient history of Veliky Novgorod?","Who founded the old city of Veliky Novgorod?","What makes Veliky Novgorod a popular tourist destination?","What are the most interesting sights to visit in Veliky Novgorod?","How is it possible to get to Veliky Novgorod?","What souvenirs can be brought from the city?"],
t:["Veliky Novgorod is a nice city, perfectly located not far from Saint Petersburg and Moscow. Being one of the oldest cities in Russia, it attracts hundreds of visitors. Veliky Novgorod is often called an open-air museum of the ancient Rus. Many outstanding monuments of medieval architecture situated not only in the city centre but also in some outlying areas have been preserved. In 1992 Veliky Novgorod was given the status of the World Heritage Site of UNESCO.",
"Veliky Novgorod was founded in the 9-10 centuries. Being the best-fortified city of the ancient Rus, it has seen a lot of great events during its 11-century history. Novgorod was a political centre of large territories stretching up from Baltic lands to the Urals. For a long time, Novgorod was the largest centre of culture in Russia, where old chronicles and books were created. Moreover, the city stood on the famous trade route from the Varangians to the Greeks.",
"Veliky Novgorod was first mentioned in the year 862 in the famous historic document “The Tale of Bygone Years”. The Russian primary chronicle gives a detailed account of the early history of the eastern Slavs. It tells the story of Rurik, the Viking chieftain, who was invited to the city as a new leader. It was an important event in the history of the country as Rurik became the founder of the whole dynasty of the ancient Rus, staying in power up to the 17th century.",
"Many great monuments of medieval architecture and painting have been well kept in the city. The Novgorod Kremlin dates back to the 11th century. The Kremlin territory houses one of the most beautiful Orthodox churches, St. Sophia Cathedral, as well as the regional library and the Philharmonic building. The open-air Vitoslavlitsy museum of wooden architecture presents some excellent examples of wooden structures from different parts of the city.",
"Novgorod craftsmen have always been famous for their birchbark crafts. Tourists can find various cute items to bring back home. They are jewellery boxes, hairpins and hairbands, plates and cups. For fun, one can also buy bast shoes – traditional footwear of Russian peasants also made of birchbark. Along with birchbark items, one will always find wooden carved figures in shops. They will become a perfect gift or a home decoration for oneself.",
"The most convenient way of travelling to Veliky Novgorod is to go by train. The fastest route is now offered by the Lastochka train departing from Saint Petersburg twice a day. Travel time is less than 3 hours, which is much faster than travelling by train from Moscow, which will take the whole night. Bus trips are available as well. Getting to Veliky Novgorod by car is also quite a fast and convenient way for those who choose privacy and comfort."]}];

const HC={id:"684ECB",
txt:["Hermitage cats have been officially kept in the Winter Palace in St. Petersburg, Russia, since its foundation. The cats prevented intensive breeding of rats and mice in the State Hermitage Museum. The director of the Hermitage, Mikhail Piotrovsky, said, “Cats have become a very important part of our Hermitage lives and a significant part of Hermitage Legends.”",
"It is believed that the history of the Hermitage cats started with a cat that was brought from Holland by Peter the Great. In the XVIII century there were lots of rats in the Old Winter Palace. The history of cats continued due to Empress Elizaveta Petrovna. Visiting Kazan, she noticed that there were no rats and mice in the city because of the large number of cats. The Empress ordered to bring some Kazan cats to St Petersburg, to the old Winter Palace. The cats had done their job, and almost all the rats disappeared from the palace. After the construction of the Winter Palace, the cats settled down in the new building too. The founder of the Hermitage, Empress Catherine II, gave the cats the status of ‘gallery guards’.",
"Cats in the Hermitage existed for a long time, during the war with Napoleon, and after the revolution, under the Soviet regime. In 1941, when the Great Patriotic War began, the works of art were evacuated to the Urals, to Sverdlovsk. After the war, two cars brought new cats to the Hermitage. The rats, that had invaded the building during the war, stepped back. However, in the 1960s it was decided that the cats were not needed any more. Employees of the museum caught the cats and took them away. But, soon after, rats invaded the building. Since then, the museum has never got rid of its cats.",
"Today, about seventy cats live in the Hermitage to protect it from mice and rats. Each cat has its own passport and a veterinary card. They live comfortably in the basement. The place where they live is always warm and dry, and all the rooms of the basement are equipped with small holes, to let the cats move freely inside and outside the building.",
"The Hermitage employees regularly buy food for the cats. They try to make their meals healthy and diverse. Each cat has its own bowl, tray and basket to sleep. In summer, the cats are more often outside on the lawns and courtyards than in their basement.",
"To control the number of cats in the Hermitage, employees sometimes give away their cats to residents of the city. The new owner has to present their passport and leave their contact details. The adopted animals are accompanied by a certificate from the Hermitage."],

const $=s=>document.querySelector(s),app=$("#app");

d.t.map((t,j)=>`<div class="card"><b>${L[j]}</b> ${t}</div>`).join("")+
`<div class="card">`+d.q.map((q,j)=>`<div class="q" id="q${j}"><span>${j+1}. ${q}</span><select><option value="">?</option>${[...L].map(c=>`<option>${c}</option>`).join("")}<option value="-">нет ответа</option></select></div>`).join("")+
`</div><div class="row"><button class="btn p" id="ck">Проверить</button><button class="btn" id="rs">Сначала</button></div><div class="res" id="res"></div>`;

`</div><div class="row"><button class="btn p" id="ck">Проверить</button></div><div class="res" id="res"></div>`;

function v20(i=0){const d=G[i];

["Прощание (Best wishes, Write soon, Bye …)",/best wishes|write soon|all the best|bye|yours|regards|cheers/i.test(t)],["Подпись (имя на последней строке)",lines.length>2&&last.split(/\s+/).length<=2&&!/[.?!]$/.test(last.trim())]];
$("#ls").innerHTML=`<div class="card">`+c.map(x=>`<div class="q ${x[1]?"ok":"no"}">${x[0]}<b>${x[1]?"✓":"✗"}</b></div>`).join("")+`<p class="hint">Проверяется только формат. Содержательные ответы на 3 вопроса оценивает учитель.</p></div>`}}
